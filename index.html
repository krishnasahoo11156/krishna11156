<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio of Krishna Sahoo">
  <title>Krishna Sahoo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <canvas id="doodle-canvas"></canvas>

  <main>
    <section class="hero" id="hero-section">
      <div class="hero-container">
        
        <!-- Center Profile Image & Overlapping Stencil Text -->
        <div class="hero-image-wrapper">
          <div class="profile-container" id="profile-container">
            
            <!-- Background Text (Grey, sits behind the image) -->
            <div class="overlapping-text background-text">
              <div>KRISHNA</div>
              <div>SAHOO</div>
            </div>

            <!-- Profile Image -->
            <img src="assets/images/profile1_transparent.png" alt="Krishna Sahoo" class="profile-img" id="profile-image">
            
            <!-- Foreground Text Mask (Clipped to the image, matching color of body background) -->
            <div class="foreground-text-mask-wrapper">
              <div class="overlapping-text foreground-text">
                <div>KRISHNA</div>
                <div>SAHOO</div>
              </div>
            </div>

          </div>
        </div>
        
      </div>
    </section>
  </main>

  <script src="assets/js/doodles.js" defer></script>
</body>
</html>
